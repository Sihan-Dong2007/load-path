<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Load Path</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1320;
    overflow: hidden;
  }
  #tray {
    height: 80px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    box-sizing: border-box;
  }
  #tray-label {
    color: #8fa3bf;
    font: 14px system-ui, sans-serif;
    margin-right: 16px;
  }
  #load-handle {
    width: 40px;
    height: 40px;
    background: #f2545b;
    border-radius: 6px;
    cursor: grab;
    touch-action: none;
  }
  #load-handle.dragging {
    position: fixed;
    z-index: 10;
    cursor: grabbing;
  }
  canvas {
    display: block;
    width: 100vw;
    height: calc(100vh - 80px);
  }
</style>
</head>
<body>
<div id="tray">
  <span id="tray-label">Drag the weight onto the structure:</span>
  <div id="load-handle"></div>
</div>
<canvas id="stage" width="1200" height="600"></canvas>
<script type="module" src="src/main.js"></script>
</body>
</html>
